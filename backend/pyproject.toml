[project]
name = "ai-renovate-backend"
version = "0.1.0"
description = "AI 家装项目后端 — FastAPI + Pydantic AI"
requires-python = ">=3.11"
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # --- AI 编排 ---
    "pydantic-ai>=0.0.15",

    # --- 数据库 ---
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",

    # --- 图像处理 ---
    "pillow>=10.0",

    # --- HTTP 客户端 ---
    "httpx>=0.27",

    # --- 配置 ---
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
