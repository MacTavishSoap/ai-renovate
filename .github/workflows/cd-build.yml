# CD: push 到 main/master 时自动构建 Docker 镜像
# 如后续需要推送到镜像仓库（Docker Hub / 阿里云 ACR），在仓库 Settings → Secrets 配置对应凭据即可
name: CD-Build

on:
  push:
    branches: [main, master]
    tags: ['v*']  # 打 tag 时也触发，用于版本发布

  # 手动触发
  workflow_dispatch:

jobs:
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: ai-renovate-backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: ai-renovate-frontend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

