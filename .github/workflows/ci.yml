# CI: Pull Request / Push 时自动跑测试和 lint
# 触发条件：向 main/master 分支 push，或针对 main/master 的 PR
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: 📦 安装依赖
        run: pip install -e ".[dev]"

      - name: 🔍 代码检查（编译验证）
        run: python -m py_compile $(find app -name "*.py") && echo "✅ 编译通过"

      - name: 🧪 运行测试
        run: python -m pytest tests/ -v --tb=short
