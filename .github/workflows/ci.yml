# CI: Pull Request / Push 时自动跑测试和 lint
# 触发条件：向 main/master 分支 push，或针对 main/master 的 PR
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout 代码
        uses: actions/checkout@v4

      - name: 🐍 安装 uv (极速 Python 包管理器)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 📦 安装依赖
        run: uv pip install --system -e ".[dev]"

      - name: 🔍 代码检查（编译验证）
        run: python -m py_compile $(find app -name "*.py") && echo "✅ 编译通过"

      - name: 🧪 运行测试
        run: python -m pytest tests/ -v --tb=short
